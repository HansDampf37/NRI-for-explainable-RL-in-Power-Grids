setup:
  max_ep_len: 8064
  duration: 22:00  # 22 hours
  nb_timesteps: 100_000
  checkpoint_freq: 10
  verbose: 0
  my_log_level: 1
  folder_name: 0501_gnn_hyperparameter_optimization
  experiment_name: 0501_gnn_hyperparameter_optimization
  optimization:
    enable: True
    score_metric: evaluation/custom_metrics/grid2op_end_mean
    mode: max
    n_trials: ~ # if n_trials is None, will run until duration is reached
    load_from: ~  # load previous optimization results from this dir
    points_to_evaluate:
      hidden_dim: 64
      out_dim: 64
      num_layers: 2
      residual: True
  debugging:
    seed: &seed 42

training:
  checkpoint_trainable_policies_only: True
  # PPO hyperparameters - using reasonable defaults
  gamma: 0.99
  lr: 0.0001
  vf_loss_coeff: 0.5
  entropy_coeff: 0.00
  kl_coeff: 0.2
  clip_param: 0.3
  lambda: 0.95
  vf_clip_param: 100
  use_kl_loss: False
  num_sgd_iter: 5
  sgd_minibatch_size: 256
  train_batch_size: 1024
  batch_mode: complete_episodes
  model:
    fcnet_hiddens: [256, 256, 256]  # Downstream MLP after GNN
    fcnet_activation: relu
    post_fcnet_hiddens: [256, 128]
    custom_model_config:
      gnn: # GNN-specific hyperparameters to optimize
        hidden_dim: !choice [32, 64, 128, 256]  # Hidden dimension for GNN layers
        out_dim: !choice [32, 64, 128]  # Output dimension of GNN
        num_layers: !quniform [1, 4, 1]  # Number of GNN layers (1-4)
        residual: !choice [True, False]  # Whether to use residual connections
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CustomMetricsCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha
    mask: 5
    lib_dir: !workdir
    grid2op_kwargs:
      reward_class: !AlphaZeroRW
    seed: *seed
    rho_threshold: 0.95
    n_history: 1
    g2op_input: ["r", "t"]
    custom_input: ["d"]
    danger: 0.9
    prio: False
    use_ffw: True
    reset_topo: 0.9
    line_reco: True
    line_disc: False
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [150, 300]

evaluation:
  evaluation_interval: 5  # Evaluate every 5 iterations to save time
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
  evaluation_num_workers: 30
  evaluation_config:
    explore: False
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val
      shuffle_scenarios: False
      prio: False

reporting:
  keep_per_episode_custom_metrics: True

resources:
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 80

