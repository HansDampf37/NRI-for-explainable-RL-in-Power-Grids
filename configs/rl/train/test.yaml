timesteps: 2
log_interval: 1
curriculum_level_config:
    active: true
    start_level: 0
    level1_at_fraction: 0.5        # 1/2 of total training time
    level2_at_fraction: 1.0  # not active
pretrain_encoder:
    ds_size: 1
    test_ds_size: 1
    num_epochs: 1
    batch_size: 1
    learning_rate: 0.005
    evaluate_every_k_epochs: 1