setup:
  max_ep_len: 8064
  duration: 22:00  # 22 hours
  nb_timesteps: 50_000
  checkpoint_freq: 5
  verbose: 0
  my_log_level: 1
  folder_name: 0501_ragnn_hyperparameter_optimization
  experiment_name: 0501_ragnn_hyperparameter_optimization
  optimization:
    enable: True
    score_metric: evaluation/custom_metrics/grid2op_end_mean
    mode: max
    n_trials: ~ # if n_trials is None, will run until duration is reached
    load_from: ~  # load previous optimization results from this dir
    points_to_evaluate:
      hidden_dim: 64
      out_dim: 64
      num_layers: 2
      residual: True

debugging:
  seed: &seed 42

encoder_pretrain: # Encoder pretraining for RAGNN
  enabled: true
  ds_size: 1000
  batch_size: 32
  num_epochs: 30
  learning_rate: 0.005

training:
  checkpoint_trainable_policies_only: True
  # PPO hyperparameters - using reasonable defaults
  gamma: 0.99
  lr: 0.0001
  vf_loss_coeff: 0.5
  entropy_coeff: 0.00
  kl_coeff: 0.2
  clip_param: 0.3
  lambda: 0.95
  vf_clip_param: 100
  use_kl_loss: False
  num_sgd_iter: 5
  sgd_minibatch_size: 256
  train_batch_size: 1024
  batch_mode: complete_episodes
  relation_awareness: # RAGNN-specific settings - OPTIMIZING THESE PARAMETERS
    prior_prob_for_graph_edge: !uniform [0.0, 1.0]  # Prior probability for graph edge
    beta: !uniform [0.5, 2.0]  # Beta parameter for relation awareness
    temperature: !uniform [0.0, 1.0]  # the amount of additional edges inferred by the encoder
  model:
    fcnet_hiddens: [256, 256, 256]  # Downstream MLP after GNN
    fcnet_activation: relu
    post_fcnet_hiddens: [256, 128]
    custom_model_config:
      gnn: # GNN-specific hyperparameters - WILL BE COPIED FROM OPTIMAL GNN CONFIG LATER
        hidden_dim: 64  # Use optimal value from GNN optimization
        out_dim: 64  # Use optimal value from GNN optimization
        num_layers: 2  # Use optimal value from GNN optimization
      encoder: # RAGNN encoder settings
        num_edge_types: !choice [2, 3, 4]  # Number of edge types (2-6)
        max_degree: 7
        max_path_distance: 9
        use_graphormer: True
        hidden_dim: !choice [32, 64, 128, 256]
        num_layers: !choice [2, 3, 4]
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !EncoderPretrainCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha
    mask: 5
    lib_dir: !workdir
    grid2op_kwargs:
      reward_class: !AlphaZeroRW
    seed: *seed
    rho_threshold: 0.95
    n_history: 1
    g2op_input: ["r", "t"]
    custom_input: ["d"]
    danger: 0.9
    prio: False
    use_ffw: True
    reset_topo: 0.9
    line_reco: True
    line_disc: False
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [150, 300]

evaluation:
  evaluation_interval: 5  # Evaluate every 5 iterations to save time
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
  evaluation_num_workers: 30
  evaluation_config:
    explore: False
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val
      shuffle_scenarios: False
      prio: False

reporting:
  keep_per_episode_custom_metrics: True

resources:
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 80
