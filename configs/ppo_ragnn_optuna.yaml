setup:
  max_ep_len: 8064
  duration: 70:00 # hh:mm
  nb_timesteps: 160_000
  checkpoint_freq: 5
  verbose: 0
  my_log_level: 2
  storage_path: ./runs
  folder_name: 0501_ragnn_hyperparameter_optimization
  experiment_name: 0501_ragnn_hyperparameter_optimization
  optimization:
    enable: True
    score_metric: evaluation/custom_metrics/grid2op_end_mean
    mode: max
    n_trials: ~ # if n_trials is None, will run until duration is reached
    load_from: ~  # load previous optimization results from this dir
    points_to_evaluate:
      relation_awareness/prior_prob_for_graph_edge: 0.9
      relation_awareness/beta_start: 0.0
      relation_awareness/beta_end: 5.0
      relation_awareness/beta_non_graph_edges_start: 0.0
      relation_awareness/beta_non_graph_edges_end: 0.5
      relation_awareness/tau_start: 2.0
      relation_awareness/tau_end: 0.5
      relation_awareness/temperature: 0.5
      model/custom_model_config/encoder/num_edge_types: 2
      model/custom_model_config/encoder/hidden_dim: 64
      model/custom_model_config/encoder/num_layers: 2
      encoder_pretrain/enabled: True
  post_training_evaluation:
    enabled: True  # Whether to evaluate the best checkpoint after training
    env_name: l2rpn_case14_sandbox_val  # Environment to use for evaluation
    num_episodes: all  # Number of episodes to evaluate (use "all" for all available episodes)
    visualize: False  # Whether to show visualization after evaluation
debugging:
  seed: &seed 42

training:
  checkpoint_trainable_policies_only: True
  # PPO hyperparameters - using reasonable defaults
  gamma: 0.99
  lr: 0.0001
  vf_loss_coeff: 0.5
  entropy_coeff: 0.00
  kl_coeff: 0.2
  clip_param: 0.3
  lambda: 0.95
  vf_clip_param: 100
  use_kl_loss: False
  num_sgd_iter: 5
  sgd_minibatch_size: 256
  train_batch_size: 1024
  batch_mode: complete_episodes
  encoder_pretrain: # Encoder pretraining for RAGNN
    enabled: !choice [True, False]
    ds_size: 1000
    batch_size: 32
    num_epochs: 15
    learning_rate: 0.005
  relation_awareness: # this section is only used if model_type == "RAGNN", select model type via cli args
    prior_prob_for_graph_edge: !uniform [0.0, 1.0]
    beta_start: !uniform [0.0, 1.0]
    beta_end: !uniform [1.0, 7.0]
    tau_start: !uniform [1.0, 2.5] # Start with high temperature
    tau_end: !uniform [0.2, 1.0]  # Anneal to this value
    beta_non_graph_edges_start: !uniform [0.0, 1.0]
    beta_non_graph_edges_end: !uniform [1.0, 2.0]
    # Legacy parameters
    tau: 0.2 # override if no annealing is used (e.g. final evaluation)
    beta: 1.0
    temperature: !uniform [0.0, 1.0]
  model:
    fcnet_hiddens: [256, 256, 256]  # Downstream MLP after GNN
    fcnet_activation: relu
    post_fcnet_hiddens: [256, 128]
    custom_model_config:
      gnn: # GNN-specific hyperparameters - WILL BE COPIED FROM OPTIMAL GNN CONFIG LATER
        hidden_dim: 265  # Use optimal value from GNN optimization
        out_dim: 64  # Use optimal value from GNN optimization
        num_layers: 3  # Use optimal value from GNN optimization
        residual: True
      encoder: # RAGNN encoder settings
        num_edge_types: !choice [2, 3]  # Number of edge types (2-6)
        max_degree: 7
        max_path_distance: 9
        use_graphormer: True
        hidden_dim: !choice [32, 64, 128]
        num_layers: !choice [2, 3]
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !AnnealingCallback
    - !EncoderPretrainCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha
    mask: 5
    lib_dir: !workdir
    grid2op_kwargs:
      reward_class: !AlphaZeroRW
    seed: *seed
    rho_threshold: 0.95
    n_history: 1
    g2op_input: ["r", "t"]
    custom_input: ["d"]
    danger: 0.9
    prio: False
    use_ffw: True
    reset_topo: 0.9
    line_reco: True
    line_disc: False
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [150, 300]

evaluation:
  evaluation_interval: 5  # Evaluate every 5 iterations to save time
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
  evaluation_num_workers: 30
  evaluation_config:
    explore: False
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val
      shuffle_scenarios: False
      prio: False

reporting:
  keep_per_episode_custom_metrics: True

resources:
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 80
