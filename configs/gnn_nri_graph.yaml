setup:
  max_ep_len: 8064
  duration: ~ # HH:MM or minutes of training before stopping, overwrites nb_timesteps limit if value > 0
  nb_timesteps: 160_000 # 500.000 with opponent
  checkpoint_freq: 5
  verbose: 0
  my_log_level: 2
  storage_path: ./runs
  folder_name: 0501_compare_gnn_ragnn_mlp
  experiment_name: 0501_compare_gnn_ragnn_mlp
  optimization:
    enable: False
    score_metric: ~
    mode: ~
    n_trials: ~
    points_to_evaluate: ~
    load_from: ~  # load previous optimization results from this dir
  post_training_evaluation:
    enabled: True  # Whether to evaluate the best checkpoint after training
    env_name: l2rpn_case14_sandbox_test  # Environment to use for evaluation
    num_episodes: all  # Number of episodes to evaluate (use "all" for all available episodes)
    visualize: False  # Whether to show visualization after evaluation
debugging:
  seed: &seed 14

training:
  checkpoint_trainable_policies_only: True
  gamma: 0.99 #!quniform [0.975, 0.995, 0.001] #
  lr: 0.0001 #!qloguniform [0.0001, 0.005, 0.0001] #
#  use_kl_loss: False # setting this similar to orig EVDS implementation
  kl_coeff: 0.2
  entropy_coeff: 0.0 # 0.0 # with opponent: 0.01 #!choice [0.1, 0.0] #
  clip_param:  0.3 # !choice [0.2, 0.3] # epsilon
  lambda: 0.95
  vf_loss_coeff: 0.5
  vf_clip_param: 100
  num_sgd_iter: 5 # 5 # with opponent: 15 #!quniform [4, 16, 4] #
  sgd_minibatch_size: 256 #128 #!choice [64, 128, 256] #
  train_batch_size: 1024 #256 # 128 #!choice [256, 512, 1024] #
  batch_mode: complete_episodes
  model:
#    custom_model : linfcn
    fcnet_hiddens: [256,256,256] # !choice [(128,128,128), (256,256,256), (256, 128, 256)]  # [128,128,128] #
    fcnet_activation: relu #!choice [relu, tanh] #
#    post_fcnet_hiddens: !choice [(),(128), (256)] #[256] #
    custom_model_config:
      gnn: # this section is only used if model_type == "GNN" or "RAGNN" select model type via cli args
        hidden_dim: 256
        out_dim: 64
        num_layers: 3
        edge_probs_path: "/pfs/data6/home/ka/ka_iai/ka_hw6998/dev/NRI-for-explainable-RL-in-Power-Grids/results/edge_probabilities/consensus_graph_data_edges_testing_NRI_with_forecast_agreement_0.9_prob_0.9_js_0.1.npy"
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !AnnealingCallback
    - !EncoderPretrainCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha # options: assym, medha, tennet, d3qn2022, masked
    mask: 3 # only used if action space is "masked" (as in SMAAC from Yoon et al. 2021)
    lib_dir: !workdir
    grid2op_kwargs:
      # general kwargs
      reward_class: !AlphaZeroRW #!ScaledL2RPNReward #L2RPNReward #!LossRwRescaled2 #!LossRwNew #!AlphaZeroRW #!LinesCapacityReward #!LossReward #!RewardRho #!ConstantReward
    seed: *seed
    rho_threshold: 0.95
    prio: False
    use_ffw: False # feed forward chronic when using prio
    g2op_input: ['r', 't'] # ["p_i", "p_l", "r", "o", "t" ] #['v_l', 'a', 'r', 't'] # #"all" #all options: ["t" (topo), "l" (line status), "p_i"(active power input), "p_l" (act power lines), "q_i", "q_l", "v_i", "v_l", "theta_i", "theta_l", "a", "r", "o", "m" ]
    custom_input: ["d"] #options: [ "d" (danger), "t" (time of day), "y" (day of year)]
    danger: 0.9 # used when danger is in custom_input
    n_history: 1 # If n_history > 1, the observation will be a list of previous observations
    reset_topo: 0.9 # No reset topo applied when = 0
    line_reco: True # Line reconnection when possible
    line_disc: False # Line disconnection when overloaded for >1 consecutive time steps
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [20_000,46_667] # used if curriculum_training is True

evaluation:
  evaluation_interval: 5
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
  evaluation_sample_timeout_s: 720
#  evaluation_parallel_to_training: True #Currently not working
  evaluation_num_workers: 30
  evaluation_config:
    explore: True,
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val # use the validation environment
      shuffle_scenarios: False
      prio: False # should always be False
      curriculum_training: False

reporting:
  keep_per_episode_custom_metrics: True

scaling_config:
  num_workers: 1

resources:
  #num_gpus: 1
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 80
