setup:
  max_ep_len: 8064
  duration: ~ # HH:MM or minutes of training before stopping, used if value > 0
  nb_timesteps: 10_000
  checkpoint_freq: 10
  verbose: 0
  my_log_level: 1
  storage_path: ./runs
  folder_name: TestSandbox14
  experiment_name: TestSb14
  optimization:
    enable: False
    score_metric: ~
    mode: ~
    n_trials: ~
    points_to_evaluate: ~
    load_from: ~  # load previous optimization results from this dir
  post_training_evaluation:
    enabled: True  # Whether to evaluate the best checkpoint after training
    env_name: l2rpn_case14_sandbox_val  # Environment to use for evaluation
    num_episodes: all  # Number of episodes to evaluate (use "all" for all available episodes)
    visualize: False  # Whether to show visualization after evaluation
  debugging:
    seed: &seed 9

training:
  checkpoint_trainable_policies_only: True
  gamma: 0.99 #!quniform [0.95, 0.99, 0.01] #
  lr: 0.0001 #!qloguniform [0.0005, 0.005, 0.0001] #
  vf_loss_coeff: 0.5
  entropy_coeff: 0.05
  clip_param: 0.3 # epsilon
  lambda: 0.95
  vf_clip_param: 100
  use_kl_loss: False # setting this similar to orig EVDS implementation
  num_sgd_iter: 4 #spec.configs.train_batch_size / spec.configs.sgd_minibatch_size !quniform [4, 16, 4] #
  sgd_minibatch_size: 32 #!choice [32, 64, 128] #
  train_batch_size: 128 #80 #!choice [128, 256, 512] #
  batch_mode: complete_episodes
  encoder_pretrain: # this section is only used if model_type == "RAGNN" and callbacks include EncoderPretrainCallback
    enabled: true  # Set to true to enable encoder pretraining
    ds_size: 1000
    batch_size: 32
    num_epochs: 40
    learning_rate: 0.005
  relation_awareness: # this section is only used if model_type == "RAGNN", select model type via cli args
    prior_prob_for_graph_edge: 0.9
    beta_start: 0.0  # Start beta at 0
    beta_end: 1.0  # Anneal to this value
    tau_start: 1.0  # Start with high temperature
    tau_end: 0.2  # Anneal to this value
    # Legacy parameters
    beta: 1.0
    temperature: 0.2
  model:
#    custom_model : linfcn
    fcnet_hiddens: [256,256,256] # !choice [[256,256,256], [128,128,128]] #
    fcnet_activation: relu #!choice [relu, tanh] #
    post_fcnet_hiddens: [256,128]
    custom_model_config:
      gnn: # this section is only used if model_type == "GNN" or "RAGNN", select model type via cli args
        hidden_dim: 64
        out_dim: 64
        num_layers: 2
        edge_probs_path: /pfs/data6/home/ka/ka_iai/ka_hw6998/dev/NRI-for-explainable-RL-in-Power-Grids/results/edge_probabilities/edges_averaged_with_forecast_2026-01-08_14-11-58.npy
      encoder: # this section is only used if model_type == "RAGNN", select model type via cli args
        max_degree: 7 # todo change if bigger envs are considered
        max_path_distance: 9 # todo change if bigger envs are considered
        use_graphormer: True
        hidden_dim: 64
        num_layers: 2
        num_edge_types: 2
  _enable_learner_api: False
  
rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !EncoderPretrainCallback
    - !AnnealingCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha
    mask: 5
    lib_dir: !workdir
    grid2op_kwargs:
      # general kwargs
      reward_class: !RewardRho
    seed: *seed
    rho_threshold: 0.90
    n_history: 1
    g2op_input: ["r", "t"] # default Box obs inputs
    custom_input: ["d"]
    danger: 0.9
    prio: False
    use_ffw: True
    reset_topo: 0.9
    line_reco: True # Line reconnection when possible
    line_disc: True # Line disconnection when overloaded for 2 consecutive time steps
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [150,300] # used if curriculum_training is True

evaluation:
  evaluation_interval: 1
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
#  evaluation_parallel_to_training: True #Currently not working
  evaluation_num_workers: 0
  evaluation_config:
    explore: False,
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val # use the validation environment
      shuffle_scenarios: False
      prio: False # should always be False

reporting:
  keep_per_episode_custom_metrics: True

resources:
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 0
