setup:
  max_ep_len: 8064
  duration: ~ # HH:MM or minutes of training before stopping, overwrites nb_timesteps limit if value > 0
  nb_timesteps: 100  # Minimal timesteps for quick testing
  checkpoint_freq: 100  # Less frequent checkpointing
  verbose: 0
  my_log_level: 2
  storage_path: ./runs
  folder_name: test_minimal
  experiment_name: test_minimal
  ray_local_mode: true  # Enable local mode for easier debugging
  optimization:
    enable: false
    score_metric: evaluation/custom_metrics/grid2op_end_mean
    mode: max
    num_trials: 2
    load_from: ~  # load previous optimization results from this dir
    points_to_evaluate:
      relation_awareness/prior_prob_for_graph_edge: 1.0
      relation_awareness/beta: 1.0
      relation_awareness/temperature: 0.0
      model/custom_model_config/encoder/num_edge_types: 2
      model/custom_model_config/encoder/hidden_dim: 256
      model/custom_model_config/encoder/num_layers: 2
  post_training_evaluation:
    enabled: True  # Whether to evaluate the best checkpoint after training
    env_name: l2rpn_case14_sandbox_val  # Environment to use for evaluation
    num_episodes: 1  # Number of episodes to evaluate (use "all" for all available episodes)
    visualize: False  # Whether to show visualization after evaluation

debugging:
  seed: &seed 42

training:
  checkpoint_trainable_policies_only: True
  gamma: 0.99
  lr: 0.0001
  kl_coeff: 0.2
  entropy_coeff: 0.0
  clip_param:  0.3
  lambda: 0.95
  vf_loss_coeff: 0.5
  vf_clip_param: 100
  num_sgd_iter: 5
  sgd_minibatch_size: 256
  train_batch_size: 1024
  batch_mode: complete_episodes
  encoder_pretrain:
    enabled: true
    ds_size: 10
    batch_size: 10
    num_epochs: 1
    learning_rate: 0.0001
  relation_awareness:
    prior_prob_for_graph_edge: !uniform [ 0.0, 1.0 ]
    beta_start: 0.0  # Start beta at 0
    beta_end: !uniform [ 0.5, 4.0 ]  # Anneal to this value
    tau_start: 1.5  # Start with high temperature
    tau_end: !uniform [ 0.5, 1.0 ]  # Anneal to this value
    # Legacy parameters for backwards compatibility
    tau: 0.5 # override if no annealing is used (e.g. final evaluation)
    beta: !uniform [ 0.5, 4.0 ]  # Beta parameter for relation awareness
    temperature: !uniform [ 0.0, 1.0 ]  # the amount of additional edges inferred by the encoder
  model:
    fcnet_hiddens: [ 256, 256, 256 ]  # Downstream MLP after GNN
    fcnet_activation: relu
    # post_fcnet_hiddens: [ 256, 128 ]
    custom_model_config:
      gnn: # this section is only used if model_type == "GNN" or "RAGNN" select model type via cli args
        hidden_dim: 256
        out_dim: 64
        num_layers: 3
        edge_probs_path: "/pfs/data6/home/ka/ka_iai/ka_hw6998/dev/NRI-for-explainable-RL-in-Power-Grids/results/edge_probabilities/edges_averaged_with_forecast_2026-01-08_14-11-58.npy"
      encoder: # this section is only used if model_type == "RAGNN", select model type via cli args
        num_edge_types: !choice [ 2, 3, 4 ]  # Number of edge types (defaults to 2: edge exists or doesn't exist)
        max_degree: 7
        max_path_distance: 9
        use_graphormer: True
        hidden_dim: !choice [ 32, 64, 128, 256 ]
        num_layers: !choice [ 2, 3, 4 ]
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !AnnealingCallback
    - !EncoderPretrainCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: d3qn2022 # options: assym, medha, tennet, d3qn2022, masked
    mask: 3 # only used if action space is "masked" (as in SMAAC from Yoon et al. 2021)
    lib_dir: !workdir
    grid2op_kwargs:
      # general kwargs
      reward_class: !ScaledL2RPNReward #!ScaledL2RPNReward #L2RPNReward #!LossRwRescaled2 #!LossRwNew #!AlphaZeroRW #!LinesCapacityReward #!LossReward #!RewardRho #!ConstantReward
    seed: *seed
    rho_threshold: 0.99
    prio: False
    use_ffw: False # feed forward chronic when using prio
    g2op_input: ['r', 't'] # ["p_i", "p_l", "r", "o", "t" ] #['v_l', 'a', 'r', 't'] # #"all" #all options: ["t" (topo), "l" (line status), "p_i"(active power input), "p_l" (act power lines), "q_i", "q_l", "v_i", "v_l", "theta_i", "theta_l", "a", "r", "o", "m" ]
    custom_input: [] #options: [ "d" (danger), "t" (time of day), "y" (day of year)]
    danger: 0.9 # used when danger is in custom_input
    n_history: 1 # If n_history > 1, the observation will be a list of previous observations
    reset_topo: 0.9 # No reset topo applied when = 0
    line_reco: True # Line reconnection when possible
    line_disc: False # Line disconnection when overloaded for >1 consecutive time steps
    penalty_game_over: -300
    reward_finish: 500
    curriculum_training: True
    curriculum_thresholds: [20, 40] # used if curriculum_training is True

evaluation:
  evaluation_interval: 1
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: True
  evaluation_sample_timeout_s: 720
#  evaluation_parallel_to_training: True #Currently not working
  evaluation_num_workers: 1
  evaluation_config:
    explore: False,
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val
      shuffle_scenarios: False
      prio: False
      curriculum_training: False

reporting:
  keep_per_episode_custom_metrics: True

scaling_config:
  num_workers: 1

resources:
  #num_gpus: 1
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 1

