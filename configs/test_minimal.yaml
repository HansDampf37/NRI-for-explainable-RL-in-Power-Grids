setup:
  max_ep_len: 8064
  duration: 00:01 # HH:MM or minutes of training before stopping, used if value > 0
  nb_timesteps: 1000  # Minimal timesteps for quick testing
  checkpoint_freq: 100  # Less frequent checkpointing
  verbose: 0
  my_log_level: 2
  storage_path: ./runs
  folder_name: test_minimal
  experiment_name: test_minimal
  ray_local_mode: true  # Enable local mode for easier debugging
  optimization:
    enable: False
    score_metric: evaluation/custom_metrics/grid2op_end_mean
    mode: max
    num_trials: ~
    load_from: ~  # load previous optimization results from this dir
    points_to_evaluate:
      relation_awareness/prior_prob_for_graph_edge: 1.0
      relation_awareness/beta: 1.0
      relation_awareness/temperature: 0.0
      model/custom_model_config/encoder/num_edge_types: 2
      model/custom_model_config/encoder/hidden_dim: 256
      model/custom_model_config/encoder/num_layers: 2
  post_training_evaluation:
    enabled: True  # Whether to evaluate the best checkpoint after training
    env_name: l2rpn_case14_sandbox_val  # Environment to use for evaluation
    num_episodes: 1  # Number of episodes to evaluate (use "all" for all available episodes)
    visualize: False  # Whether to show visualization after evaluation

debugging:
  seed: &seed 42

training:
  checkpoint_trainable_policies_only: True
  gamma: 0.99  # Fixed value for testing
  lr: 0.0001
  vf_loss_coeff: 0.5
  entropy_coeff: 0.05
  clip_param: 0.3
  lambda: 0.95
  vf_clip_param: 100
  use_kl_loss: False
  num_sgd_iter: 1  # Minimal SGD iterations
  sgd_minibatch_size: 32
  train_batch_size: 128
  batch_mode: complete_episodes
  encoder_pretrain:
    enabled: true
    ds_size: 10
    batch_size: 10
    num_epochs: 1
    learning_rate: 0.0001
  relation_awareness: # RAGNN-specific settings - OPTIMIZING THESE PARAMETERS
    prior_prob_for_graph_edge: !uniform [ 0.0, 1.0 ]  # Prior probability for graph edge
    beta_start: 0.0  # Start beta at 0
    beta_end: !uniform [ 0.5, 4.0 ]  # Anneal to this value
    tau_start: 1.5  # Start with high temperature
    tau_end: !uniform [ 0.5, 1.0 ]  # Anneal to this value
    # Legacy parameters for backwards compatibility
    tau: 0.5 # override if no annealing is used (e.g. final evaluation)
    beta: !uniform [ 0.5, 4.0 ]  # Beta parameter for relation awareness
    temperature: !uniform [ 0.0, 1.0 ]  # the amount of additional edges inferred by the encoder
  model:
    fcnet_hiddens: [ 256, 256, 256 ]  # Downstream MLP after GNN
    fcnet_activation: relu
    post_fcnet_hiddens: [ 256, 128 ]
    custom_model_config:
      gnn: # GNN-specific hyperparameters - WILL BE COPIED FROM OPTIMAL GNN CONFIG LATER
        hidden_dim: 265  # Use optimal value from GNN optimization
        out_dim: 64  # Use optimal value from GNN optimization
        num_layers: 3  # Use optimal value from GNN optimization
        residual: True
      encoder: # RAGNN encoder settings
        num_edge_types: !choice [ 2, 3, 4 ]  # Number of edge types (2-6)
        max_degree: 7
        max_path_distance: 9
        use_graphormer: True
        hidden_dim: !choice [ 32, 64, 128, 256 ]
        num_layers: !choice [ 2, 3, 4 ]
  _enable_learner_api: False

rl_module:
  _enable_rl_module_api: False

explore:
  exploration_config:
    type: StochasticSampling

callbacks:
  callbacks: !CombinedCallbacks
    - !CustomMetricsCallback
    - !AnnealingCallback
    - !EncoderPretrainCallback

framework:
  framework: torch

multi_agent:
  policy_mapping_fn: !policy_mapping_fn
  policies_to_train: ["reinforcement_learning_policy"]
  count_steps_by: agent_steps

environment:
  env_config: &env_config_train
    env_name: l2rpn_case14_sandbox_train
    action_space: medha
    mask: 5
    lib_dir: !workdir
    grid2op_kwargs:
      # general kwargs
      reward_class: !RewardRho
    seed: *seed
    rho_threshold: 0.4
    n_history: 1
    g2op_input: ["r", "t"]
    custom_input: ["d"]
    danger: 0.9
    prio: False
    use_ffw: True
    reset_topo: 0.9
    line_reco: True
    line_disc: False
    penalty_game_over: 0
    reward_finish: 0
    curriculum_training: False
    curriculum_thresholds: [150,300]

evaluation:
  evaluation_interval: 1
  evaluation_duration_unit: episodes
  always_attach_evaluation_results: False
  evaluation_num_workers: 1
  evaluation_config:
    explore: False,
    env_config:
      <<: *env_config_train
      env_name: l2rpn_case14_sandbox_val
      shuffle_scenarios: False
      prio: False

reporting:
  keep_per_episode_custom_metrics: True

resources:
  num_learner_workers: 1

rollouts:
  num_rollout_workers: 1

