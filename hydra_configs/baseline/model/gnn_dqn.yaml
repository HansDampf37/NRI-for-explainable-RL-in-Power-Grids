defaults:
    - dqn_base

name: dqn-gnn

sb3:
    policy: "MultiInputPolicy"
    policy_kwargs:
        net_arch: [ 100 ]
        features_extractor_class: SB3GNNWrapper
        features_extractor_kwargs:
            x_hidden_dim: 16
            e_hidden_dim: 16
            x_out_dim: 128
            e_out_dim: 128
            n_layers: 3
            dropout_prob: 0.1
            residual: true
